<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>birthday 🎂</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&family=Aref+Ruqaa:wght@400;700&display=swap">

<style>
/* =====================================================
   1) الألوان — غيّري أي لون من هنا وهيتغير في الموقع كله
   ===================================================== */
:root{
  --night:#58331c;      /* خلفية الصفحة الأولى */
  --coffee:#4A2C1A;     /* خلفية الصفحة التانية والتالتة (لون القهوة) */
  --coffee-dark:#33200F;
  --pink:#FF6B98;       /* لون الأزرار */
  --gold:#FFC857;
  --paper:#F6F0E4;      /* لون إطار الصورة والرسالة */
  --ink:#FFF1F7;        /* لون الكتابة الفاتحة */
}

/* ---------- إعدادات عامة ---------- */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Tajawal',Tahoma,sans-serif;color:var(--ink);text-align:center;overflow-x:hidden}
h1,h2{font-family:'Reem Kufi','Tajawal',serif;margin:0;line-height:1.3}

/* كل صفحة = section. الصفحة اللي عليها كلمة active بس هي اللي بتظهر */
.page{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px}
.page.active{display:flex;animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}

#page1{background:radial-gradient(circle at 50% 30%,#8a5a38,#4A2C1A 70%)}   /* الصفحة الأولى: بني */
#page2,#page3{background:radial-gradient(circle at 50% 40%,#5b3720,var(--coffee-dark) 85%)}

/* ---------- الأزرار ---------- */
/* الزرار 3D: تدرّج لون + حافة سفلية + ظل، وبينزل لتحت لما تدوسي عليه */
button{font:inherit;font-weight:700;font-size:18px;padding:12px 26px;border:0;border-radius:14px;background:linear-gradient(180deg,#FF8FB1,#E8386D);color:#fff;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 7px 0 #A81E48,0 13px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .12s,box-shadow .12s}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(6px);box-shadow:0 1px 0 #A81E48,0 4px 8px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4)}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- الصفحة 1: التورتة ---------- */
#cake{width:min(300px,75vw);height:auto;overflow:visible}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s infinite alternate;transition:opacity .4s,transform .4s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.out .flame{opacity:0;transform:scale(.2);animation:none}   /* لما الشموع تطفي */

/* العداد */
.count{background:rgba(255,255,255,.08);border-radius:18px;padding:12px 26px}
.count small{display:block;color:#E8CBA8;font-size:16px}
#hours{font-family:'Reem Kufi',serif;font-size:clamp(40px,12vw,64px);color:var(--gold);line-height:1.2}
#rest{color:#E8CBA8;font-size:16px}

/* البلالين */
.balloon{position:fixed;bottom:-130px;width:56px;height:70px;border-radius:50% 50% 48% 48%;animation:up linear forwards;z-index:5;pointer-events:none}
.balloon::after{content:"";position:absolute;top:100%;left:50%;width:1.5px;height:45px;background:rgba(255,255,255,.6)}
@keyframes up{to{transform:translateY(-130vh) translateX(30px)}}

/* ---------- الصفحة 2: الصور ---------- */
.stage{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:24px;width:100%;max-width:980px}
.side{display:flex;flex-direction:column;gap:26px}      /* عمود صورتين (يمين / شمال) */
.mid{display:flex;flex-direction:column;gap:16px;align-items:center;min-width:220px}

/* كارت الصورة (زي كاميرا البولارويد القديمة) */
.polaroid{width:170px;background:var(--paper);padding:10px 10px 12px;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.45);color:#3a2a1a;position:relative;cursor:pointer;transition:transform .9s cubic-bezier(.2,.9,.3,1.15)}
.polaroid:nth-child(odd){transform:rotate(-4deg)}
.polaroid:nth-child(even){transform:rotate(3deg)}
.polaroid:hover{transform:rotate(0) scale(1.04)}
.photo{aspect-ratio:1;background:linear-gradient(135deg,#c9a77c,#8a5a38);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.cap{font-family:'Aref Ruqaa',serif;font-size:19px;margin-top:8px;min-height:1.4em}
.cap{text-align:center;overflow-wrap:anywhere}
.ph{display:none}
.polaroid.empty .cover{display:none}
.polaroid.empty .ph{display:flex;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#F6F0E4;font-size:40px}
.ph small{font-family:'Tajawal',sans-serif;font-size:14px}
@media(max-width:640px){
  .cover,.spreadon .polaroid.empty .ph{font-size:30px}
  .cover small,.ph small{font-size:12px}
}

/* ---------- الصفحة 3: الرسالة ---------- */
.letter{display:none;background:var(--paper);color:#3a2a1a;max-width:560px;padding:28px 26px;border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.5);font-family:'Aref Ruqaa',serif;font-size:22px;line-height:2;text-align:right}
.letter p{margin:0 0 10px}
.sign{text-align:left;font-weight:700}

/* ---------- تلميح بيرمش ("دوسي على...") ---------- */
.hint{margin:0;font-size:19px;color:var(--gold);animation:pulse 1.4s infinite alternate}
@keyframes pulse{to{opacity:.35}}

/* العنوان والزرار في نص الصفحة التانية: مخفيين لحد ما الصور تتفرق */
.mid{transition:opacity .6s}
.mid.hide{opacity:0;pointer-events:none}

/* الخلفية المعتمة وقت تكبير الصورة */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .4s;z-index:59}
#dim.on{opacity:1;pointer-events:auto}

/* ---------- غطا الصورة: الصورة مخفية لحد ما تدوسي عليها ---------- */
.photo{position:relative}
.cover{position:absolute;inset:0;background:linear-gradient(135deg,#8a5a38,#4a2c1a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:40px;transition:opacity .9s}
.cover small{font-family:'Tajawal',sans-serif;font-size:14px;color:#F6F0E4;opacity:.85}
.polaroid.shown .cover{opacity:0;pointer-events:none}
.polaroid.shown .photo img{animation:develop 1.4s}      /* الصورة بتظهر زي الصور القديمة */
@keyframes develop{from{filter:sepia(1) brightness(.4) blur(6px)}to{filter:none}}

/* ---------- اللايف فوتو: فيديو قصير فوق الصورة + شارة LIVE ---------- */
.live-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.polaroid.playing .live-vid,.live-vid.solo{opacity:1}
.live-badge{position:absolute;top:6px;left:6px;z-index:3;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.45);color:#fff;font:700 11px/1 'Tajawal',sans-serif;letter-spacing:.6px;padding:4px 8px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .5s}
.polaroid.shown .live-badge{opacity:1}
.live-badge i{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff;position:relative}
.live-badge i::after{content:"";position:absolute;inset:1.5px;border-radius:50%;background:#fff}
.polaroid.playing .live-badge i{animation:pulse .7s infinite alternate}

/* ---------- الترتر النازل وزرار الأغنية ---------- */
#glitter{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#musicBtn{position:fixed;top:12px;left:12px;z-index:20;width:46px;height:46px;padding:0;font-size:22px;line-height:46px;border-radius:50%;background:rgba(0,0,0,.4);box-shadow:0 4px 0 rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.3)}

/* ---------- الظرف القديم (الصفحة 3) ---------- */
.envelope{position:relative;width:min(340px,86vw);aspect-ratio:3/2;margin-top:60px;cursor:pointer;perspective:1000px;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
.envelope>*{position:absolute}
.env-back{inset:0;background:radial-gradient(circle at 30% 25%,#e6d2a8,#c9a96f 85%);border-radius:3px}
/* الورقة اللي جوه الظرف (بتطلع لفوق لما يتفتح) */
.env-letter{left:7%;right:7%;top:5%;bottom:5%;z-index:1;border-radius:3px;background:repeating-linear-gradient(#fbf5e6 0 15px,rgba(150,110,60,.25) 15px 16px);box-shadow:0 0 6px rgba(0,0,0,.3);transition:transform .9s cubic-bezier(.3,.8,.3,1) .5s}
/* جسم الظرف: التلات مثلثات بتاعة الطيّات */
.env-front{left:0;top:0;width:100%;height:100%;z-index:2}
/* إطار خطوط زي ظروف البريد القديمة */
.env-frame{inset:0;z-index:3;border:7px solid transparent;border-image:repeating-linear-gradient(-45deg,#b8362d 0 12px,#f3ead3 12px 20px,#2d5a94 20px 32px,#f3ead3 32px 40px) 7;pointer-events:none;opacity:.85}
/* غطا الظرف (بيتقلب لفوق) */
.flap{left:0;top:0;width:100%;height:56%;z-index:5;transform-origin:top;transform-style:preserve-3d;transition:transform .8s ease .3s,z-index 0s .65s}
.flap>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;backface-visibility:hidden}
.flap .back{transform:rotateX(180deg)}
.flap-text{position:absolute;left:0;right:0;top:14%;text-align:center;font-family:'Aref Ruqaa',serif;font-size:clamp(15px,4.6vw,20px);color:#6b4a26;backface-visibility:hidden}
/* ختم الشمع الأحمر */
.seal{left:50%;top:56%;width:58px;height:58px;margin:-29px 0 0 -29px;z-index:6;animation:beat 1.6s ease-in-out infinite}
.seal i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;color:#f3b8b2;
  border-radius:50% 46% 52% 48%/48% 52% 46% 50%;
  background:radial-gradient(circle at 35% 30%,#e0524a,#b3261e 55%,#7a130e);
  box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.25);
  text-shadow:0 -1px 0 rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.25);transition:transform .7s ease-in,opacity .7s}
.seal i::before{content:"";position:absolute;inset:7px;border:2px solid rgba(0,0,0,.22);border-radius:inherit}
.seal .l{clip-path:polygon(0 0,54% 0,45% 35%,56% 62%,48% 100%,0 100%)}
.seal .r{clip-path:polygon(54% 0,100% 0,100% 100%,48% 100%,56% 62%,45% 35%)}
@keyframes beat{50%{transform:scale(1.1)}}
/* لما الظرف يتفتح: الختم ينكسر، الغطا يتقلب، والورقة تطلع */
.envelope.open .seal{animation:none}
.envelope.open .seal .l{transform:translate(-16px,60px) rotate(-30deg);opacity:0}
.envelope.open .seal .r{transform:translate(16px,70px) rotate(30deg);opacity:0}
.envelope.open .flap{transform:rotateX(180deg);z-index:0}
.envelope.open .env-letter{transform:translateY(-40%)}
.envelope.gone{display:none}                         /* الظرف بيختفي والرسالة تظهر */
.letter.show{display:block;animation:letterIn .9s cubic-bezier(.2,.9,.3,1.1)}
@keyframes letterIn{from{opacity:0;transform:translateY(60px) scale(.6)}to{opacity:1;transform:none}}

/* ---------- ظرف الصور + الدبدوب (الصفحة 2) ---------- */
.stage{position:relative}
.pe{--w:min(280px,70vw);position:absolute;left:50%;top:50%;width:var(--w);height:calc(var(--w)*2/3);margin-left:calc(var(--w)/-2);margin-top:calc(var(--w)/-3);cursor:pointer}
.pe>*{position:absolute}
.pe-back{left:0;top:0;width:100%;height:100%;z-index:5;filter:drop-shadow(0 12px 16px rgba(0,0,0,.5))}
.pe-front{left:0;top:0;width:100%;height:100%;z-index:30;filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}
.pe-frame{inset:0;z-index:31;border:6px solid transparent;border-image:repeating-linear-gradient(-45deg,#b8362d 0 12px,#f3ead3 12px 20px,#2d5a94 20px 32px,#f3ead3 32px 40px) 6;pointer-events:none;opacity:.85}
.pe-flap{left:0;top:0;width:100%;height:56%;z-index:32;transform-origin:top;transform-style:preserve-3d;transform:perspective(900px) rotateX(0);transition:transform .8s ease .3s,z-index 0s .65s}
.pe-flap>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;backface-visibility:hidden}
.pe-flap .back{transform:rotateX(180deg)}
.pe-flap .flap-text{top:12%}
.pe-seal{left:50%;top:56%;width:52px;height:52px;margin:-26px 0 0 -26px;z-index:33;animation:beat 1.6s ease-in-out infinite}
.pe-seal i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;color:#f3b8b2;border-radius:50% 46% 52% 48%/48% 52% 46% 50%;background:radial-gradient(circle at 35% 30%,#e0524a,#b3261e 55%,#7a130e);box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 -3px 5px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.25);transition:transform .7s ease-in,opacity .7s}
.pe-seal i::before{content:"";position:absolute;inset:6px;border:2px solid rgba(0,0,0,.22);border-radius:inherit}
.pe-seal .l{clip-path:polygon(0 0,54% 0,45% 35%,56% 62%,48% 100%,0 100%)}
.pe-seal .r{clip-path:polygon(54% 0,100% 0,100% 100%,48% 100%,56% 62%,45% 35%)}
.pe.open .pe-seal{animation:none}
.pe.open .pe-seal .l{transform:translate(-16px,60px) rotate(-30deg);opacity:0}
.pe.open .pe-seal .r{transform:translate(16px,70px) rotate(30deg);opacity:0}
.pe.open .pe-flap{transform:perspective(900px) rotateX(180deg);z-index:6}
/* الدبدوب الأبيض */
.teddy{right:calc(var(--w)*-.17);bottom:-26px;width:min(112px,28vw);height:auto;z-index:40;overflow:visible;animation:bob 2s ease-in-out infinite}
.teddy .armL{transform-box:fill-box;transform-origin:50% 8%;transition:transform .3s}
.pe.open .teddy{animation:hop .5s ease-in-out 2}
.pe.open .teddy .armL{animation:wave .4s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes hop{50%{transform:translateY(-16px)}}
@keyframes wave{from{transform:rotate(120deg)}to{transform:rotate(165deg)}}
/* بعد ما الصور تتفرق: الظرف والدبدوب يختفوا */
.pe.gone{visibility:hidden;pointer-events:none;transition:visibility 0s .8s}
.pe.gone>*{opacity:0;transition:opacity .8s}

/* ---------- الموبايل: عمودين (4 يمين + 4 شمال) والصفحة بتتسكرول لتحت ---------- */
@media(max-width:640px){
  #page2{justify-content:flex-start;padding:20px 10px 80px}
  #page2 .stage{display:grid;grid-template-columns:1fr 1fr;gap:18px 10px;align-items:start;width:100%;max-width:100%}
  #page2 .mid{grid-column:1 / -1;order:-1;min-width:0;padding:30px 0 6px}
  #page2 .side{flex-direction:column;gap:24px;align-items:center;width:100%;min-width:0}
  #page2 .polaroid{width:100%;max-width:165px;padding:7px 7px 9px}
  #page2 .cap{font-size:16px;line-height:1.5;overflow-wrap:anywhere;word-break:break-word;max-width:100%}
  #pe{top:190px}                     /* الظرف قريب من فوق عشان يبان من غير سكرول */
  #hint{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:28px 12px 14px;background:linear-gradient(transparent,rgba(30,16,8,.88));pointer-events:none;font-size:17px}
  #page3{padding:24px 14px}
  .letter{font-size:19px;padding:22px 18px;max-width:100%;overflow-wrap:anywhere}
}
</style>
</head>

<body>
<canvas id="glitter"></canvas>
<button id="musicBtn" hidden aria-label="تشغيل أو إيقاف الأغنية">🔇</button>

<!-- =========================================
     الصفحة 1: التورتة + العداد + الزرار
     ========================================= -->
<section class="page active" id="page1">
  <h1 id="title"></h1>

  <svg id="cake" viewBox="0 0 320 300" role="img" aria-label="تورتة عليها شموع">
    <!-- التدرجات اللونية هي اللي بتدّي إحساس الـ3D (فاتح في النص وغامق عند الأطراف) -->
    <defs>
      <linearGradient id="gB" x1="0" x2="1"><stop offset="0" stop-color="#B21F4B"/><stop offset=".3" stop-color="#FF6B98"/><stop offset=".5" stop-color="#FF9BB9"/><stop offset=".8" stop-color="#E8386D"/><stop offset="1" stop-color="#9C1A41"/></linearGradient>
      <linearGradient id="gT" x1="0" x2="1"><stop offset="0" stop-color="#D98AAD"/><stop offset=".3" stop-color="#F7B6CF"/><stop offset=".5" stop-color="#FFDDEA"/><stop offset=".8" stop-color="#EBA3C0"/><stop offset="1" stop-color="#B96C8F"/></linearGradient>
      <linearGradient id="gCream" x1="0" x2="1"><stop offset="0" stop-color="#E4D6DD"/><stop offset=".4" stop-color="#fff"/><stop offset=".75" stop-color="#fff"/><stop offset="1" stop-color="#CDBCC6"/></linearGradient>
      <radialGradient id="gTop" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#FAD3E2"/></radialGradient>
      <radialGradient id="gPlate" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#9A6540"/><stop offset="1" stop-color="#4A2C1A"/></radialGradient>
      <radialGradient id="gPearl" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#FFD66B"/><stop offset="1" stop-color="#B8860B"/></radialGradient>
      <linearGradient id="gC" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
      <linearGradient id="gF" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF8A1F"/><stop offset=".6" stop-color="#FFC857"/><stop offset="1" stop-color="#FFF3B0"/></linearGradient>
    </defs>

    <!-- الطبق وظله -->
    <ellipse cx="160" cy="284" rx="152" ry="14" fill="#000" opacity=".3"/>
    <ellipse cx="160" cy="272" rx="150" ry="22" fill="#33200F"/>
    <ellipse cx="160" cy="268" rx="148" ry="21" fill="url(#gPlate)"/>

    <!-- الدور التحتاني: جسم أسطواني + وش بيضاوي + كريمة سايحة -->
    <path d="M50 200 V258 A110 22 0 0 0 270 258 V200 Z" fill="url(#gB)"/>
    <rect x="72" y="244" width="9" height="24" rx="4.5" fill="#fff" opacity=".2"/>
    <ellipse cx="160" cy="200" rx="110" ry="22" fill="url(#gTop)"/>
    <path d="M50 200 A110 22 0 0 0 270 200 V212 A110 22 0 0 1 50 212 Z" fill="url(#gCream)"/>
    <g fill="#fff">
      <rect x="75" y="218" width="10" height="18" rx="5"/><rect x="115" y="226" width="10" height="19" rx="5"/>
      <rect x="160" y="228" width="10" height="12" rx="5"/><rect x="200" y="226" width="10" height="20" rx="5"/>
      <rect x="240" y="218" width="10" height="18" rx="5"/>
    </g>

    <!-- الدور الفوقاني -->
    <path d="M70 140 V200 A90 18 0 0 0 250 200 V140 Z" fill="url(#gT)"/>
    <ellipse cx="160" cy="140" rx="90" ry="18" fill="url(#gTop)"/>
    <path d="M70 140 A90 18 0 0 0 250 140 V152 A90 18 0 0 1 70 152 Z" fill="url(#gCream)"/>
    <g fill="#fff">
      <rect x="95" y="158" width="9" height="14" rx="4.5"/><rect x="135" y="160" width="9" height="16" rx="4.5"/>
      <rect x="180" y="160" width="9" height="12" rx="4.5"/><rect x="217" y="158" width="9" height="18" rx="4.5"/>
    </g>
    <!-- لآلئ دهبية على الكريمة -->
    <g fill="url(#gPearl)">
      <circle cx="85" cy="156" r="4"/><circle cx="122" cy="162" r="4"/><circle cx="160" cy="164" r="4"/><circle cx="198" cy="162" r="4"/><circle cx="235" cy="156" r="4"/>
    </g>
    <g id="candles"></g><!-- الشموع بتتعمل بالجافاسكريبت تحت -->
  </svg>

  <div class="count">
    <small id="countLabel">فاضل على عيد ميلادك</small>
    <div id="hours"></div>
    <div id="rest"></div>
  </div>

  <button id="blowBtn"></button>
</section>

<!-- =========================================
     الصفحة 2: أربع صور (اتنين يمين واتنين شمال)
     ========================================= -->
<section class="page" id="page2">
  <div class="stage">

/* =====================================================
   3) باقي الكود — بيقرا الإعدادات اللي فوق ويشغّل الموقع
   ===================================================== */
const $ = id => document.getElementById(id);   // اختصار لجلب أي عنصر بالـ id

/* ----- التنقل بين الصفحات: بنشيل active من الكل ونحطها على الصفحة المطلوبة ----- */
function goTo(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
  if (id === 'page2') stackPhotos();     // كل مرة ندخل الصفحة التانية الصور تتجمع الأول
}

/* ----- كتابة النصوص من الإعدادات ----- */
$('title').textContent = `${CONFIG.title} يا ${CONFIG.name} 🎉`;
$('blowBtn').textContent = CONFIG.blowButton;
$('galleryTitle').textContent = CONFIG.galleryTitle;
$('toLetter').textContent = CONFIG.toLetterButton;
$('letterTitle').textContent = CONFIG.letterTitle;
$('restart').textContent = CONFIG.restartButton;
$('flapText').textContent = `إلى ${CONFIG.name} 💌`;
$('letter').innerHTML = CONFIG.letter.map(t => `<p>${t}</p>`).join('') +
                        `<p class="sign">${CONFIG.signature}</p>`;

/* ----- رسم الشموع ----- */
const colors = ['#5EC8E5','#FFC857','#7BD88F','#FF9A5C','#B28DFF'];
const gap = 140 / (CONFIG.candles - 1 || 1);
for (let i = 0; i < CONFIG.candles; i++){
  const x = CONFIG.candles === 1 ? 160 : 90 + i * gap;
  $('candles').insertAdjacentHTML('beforeend', `
    <ellipse cx="${x+4}" cy="141" rx="9" ry="3" fill="#000" opacity=".25"/>
    <rect x="${x-5}" y="100" width="10" height="40" fill="${colors[i % colors.length]}"/>
    <ellipse cx="${x}" cy="140" rx="5" ry="2.2" fill="${colors[i % colors.length]}"/>
    <rect x="${x-5}" y="100" width="10" height="40" fill="url(#gC)"/>
    <ellipse cx="${x}" cy="100" rx="5" ry="2.2" fill="#fff" opacity=".45"/>
    <rect x="${x-0.7}" y="95" width="1.4" height="6" fill="#3a2a1a"/>
    <path class="flame" d="M${x} 68 q9 15 0 27 q-9 -12 0 -27Z" fill="url(#gF)"/>`);
}

/* ----- العداد التنازلي بالساعات ----- */
function nextBirthday(){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let t = new Date(now.getFullYear(), CONFIG.birthday.month - 1, CONFIG.birthday.day);
  if (t < today) t.setFullYear(t.getFullYear() + 1);   // لو عدّى السنة دي، بنحسب للسنة الجاية
  return t;
}
const ar = n => n.toLocaleString('ar-EG');            // أرقام عربي
function tick(){
  const now = new Date(), t = nextBirthday();
  if (t.toDateString() === now.toDateString()){        // النهارده هو اليوم
    $('countLabel').textContent = '';
    $('hours').textContent = CONFIG.todayText;
    $('rest').textContent = '';
    return;
  }
  const diff = t - now;
  const h = Math.floor(diff / 36e5);                   // عدد الساعات
  const m = Math.floor(diff % 36e5 / 6e4);             // الدقايق
  const s = Math.floor(diff % 6e4 / 1e3);              // الثواني
  $('hours').textContent = `${ar(h)} ساعة`;
  $('rest').textContent = `و ${ar(m)} دقيقة و ${ar(s)} ثانية`;
}
tick(); setInterval(tick, 1000);

/* ----- زرار الشموع: تطفي + بلالين + الصفحة التانية ----- */
function balloons(){
  const cols = ['#FF6B98','#FFC857','#5EC8E5','#7BD88F','#B28DFF','#FF9A5C'];
  for (let i = 0; i < 22; i++){
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = Math.random() * 92 + 'vw';
    b.style.background = cols[i % cols.length];
    b.style.animationDuration = 3 + Math.random() * 2.5 + 's';
    b.style.animationDelay = Math.random() * 0.8 + 's';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 7000);
  }
}
$('blowBtn').addEventListener('click', () => {
  $('blowBtn').disabled = true;
  $('cake').classList.add('out');       // الشموع تطفي (CSS)
  balloons();
  setTimeout(() => goTo('page2'), 3200); // بعد 3.2 ثانية نروح للصفحة التانية
});

/* ----- الصفحة 2: عمل كروت الصور ----- */
const cards = [];        // كل كروت الصور
let spread = false;      // هل الصور اتفرقت ولا لسه متجمعة؟

/* تجميع الصور فوق بعض في نص الصفحة */
function stackPhotos(){
  spread = false;
  $('page2').classList.remove('spreadon');
  unzoom();
  cards.forEach(c => { c.classList.remove('shown'); if (c._stop) c._stop(); });   // الصور ترجع مخفية تاني
  $('mid').classList.add('hide');                    // نخفي العنوان والزرار لحد ما الصور تتفرق
  $('pe').classList.remove('open', 'gone');          // الظرف يتقفل والدبدوب يرجع
  $('hint').textContent = 'دوسي على الدبدوب عشان يفتح ظرف الصور 🧸';
  $('hint').style.display = '';
  const s = $('pe').getBoundingClientRect();
  const cx = s.left + s.width / 2, cy = s.top + s.height / 2;   // نص الصفحة = مكان الظرف
  cards.forEach((c, i) => {
    c.style.transition = 'none';
    c.style.transitionDelay = '0s';
    c.style.transform = '';
    const r = c.getBoundingClientRect();
    const dx = cx - (r.left + r.width / 2);
    const dy = cy - (r.top + r.height / 2);
    const rot = [-9, 6, -3, 10, -6, 8, -5, 7][i % 8];
    c.style.zIndex = 10 + i;               // فوق ضهر الظرف وتحت وش الظرف
    c.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(.6)`;   // صغيرين جوه الظرف
    void c.offsetWidth;
    c.style.transition = '';
  });
}

/* الدبدوب يفتح الظرف، وبعدها الصور تطلع وتتفرق لمكانها */
function spreadPhotos(){
  if (spread) return;
  spread = true;
  $('page2').classList.add('spreadon');
  $('pe').classList.add('open');                     // الختم ينكسر + الغطا يتفتح + الدبدوب يلوّح
  $('hint').style.display = 'none';
  cards.forEach((c, i) => {
    c.style.transitionDelay = (0.8 + i * 0.12) + 's';   // الصور تتحرك بعد ما الغطا يتفتح
    c.style.transform = '';
  });
  setTimeout(() => $('pe').classList.add('gone'), 2300);                 // الظرف والدبدوب يختفوا
  setTimeout(() => $('mid').classList.remove('hide'), 2700);             // يظهر العنوان والزرار
  setTimeout(() => {
    cards.forEach(c => { c.style.transitionDelay = '0s'; if (c !== zoomed) c.style.zIndex = ''; });
    $('hint').textContent = 'دوسي على أي صورة عشان تتفتح 🔍';
    $('hint').style.display = '';
  }, 3000);
}
$('pe').addEventListener('click', spreadPhotos);

/* اختيار صورة من الجهاز للكروت الفاضية */
const picker = document.createElement('input');
picker.type = 'file'; picker.accept = 'image/*'; picker.hidden = true;
document.body.appendChild(picker);
let pickFor = null;
picker.addEventListener('change', () => {
  const f = picker.files[0];
  if (!f || !pickFor) return;
  const c = pickFor; pickFor = null;
  const im = new Image();
  im.onload = () => {
    c._box.insertBefore(im, c._box.firstChild);
    c.classList.remove('empty');
    c.classList.add('shown');
    zoomIn(c);
  };
  im.src = URL.createObjectURL(f);
  picker.value = '';
});

CONFIG.photos.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'polaroid';
  card.innerHTML = `<div class="photo"><div class="ph">📷<small>دوسي وضيفي صورة</small></div><div class="cover">📷<small>دوسي عليا</small></div></div><div class="cap">${p.caption}</div>`;
  const box = card.querySelector('.photo');
  card._box = box;
  let vid = null;
  if (p.video) {                                   // لايف فوتو
    vid = document.createElement('video');
    vid.className = 'live-vid';
    vid.muted = true; vid.loop = false; vid.preload = 'auto';
    vid.setAttribute('playsinline', ''); vid.setAttribute('webkit-playsinline', '');
    vid.src = p.video;
    if (p.pos) vid.style.objectPosition = p.pos;
    const badge = document.createElement('div');
    badge.className = 'live-badge';
    badge.innerHTML = '<i></i>LIVE';
    box.appendChild(vid); box.appendChild(badge);
    card._live = () => { vid.currentTime = 0; card.classList.add('playing'); vid.play().catch(() => card.classList.remove('playing')); };
    card._stop = () => { vid.pause(); try { vid.currentTime = 0; } catch(e){} card.classList.remove('playing'); };
    vid.addEventListener('ended', () => card._stop && card._stop());
    vid.addEventListener('error', () => {          // الفيديو مش موجود: تفضل صورة عادية
      vid.remove(); badge.remove(); vid = null; card._live = card._stop = null;
      if (!p.src) card.classList.add('empty');
    });
  }
  if (p.src) {
    const img = new Image();
    img.onload = () => box.insertBefore(img, box.firstChild);   // الصورة بتتحط ورا الغطا
    img.onerror = () => { if (vid) vid.classList.add('solo'); else card.classList.add('empty'); };
    if (p.pos) img.style.objectPosition = p.pos;
    img.src = p.src;
  } else if (vid) {
    vid.classList.add('solo');
  } else {
    card.classList.add('empty');
  }
  // على الكمبيوتر: مرّري الماوس على الصورة المفتوحة وتتحرك
  card.addEventListener('mouseenter', () => { if (spread && card.classList.contains('shown') && zoomed !== card && card._live) card._live(); });
  card.addEventListener('mouseleave', () => { if (zoomed !== card && card._stop) card._stop(); });
  cards.push(card);
  card.addEventListener('click', () => {
    if (!spread) { spreadPhotos(); return; }                       // أول ضغطة: الصور تتفرق
    if (card.classList.contains('empty')) { pickFor = card; picker.click(); return; }   // كارت فاضي: اختاري صورة
    card.classList.add('shown');                                    // ضغطة واحدة: الصورة تتفتح وتتكبّر
    zoomIn(card);
    if (card._live) setTimeout(() => { if (zoomed === card && card._live) card._live(); }, 600);   // اللايف فوتو يتحرك
  });
  // أول 3 صور في اليمين، والباقي في الشمال
  $(i < 4 ? 'rightPhotos' : 'leftPhotos').appendChild(card);
});
/* ----- تكبير الصورة بإطارها، وضغطة تانية ترجّعها ----- */
let zoomed = null;                      // الكارت المكبّر دلوقتي (لو في)

function unzoom(){                      // رجوع الصورة لمكانها
  if (!zoomed) return;
  if (zoomed._stop) zoomed._stop();
  zoomed.style.transform = '';          // بنشيل الإزاحة والتكبير فترجع لمكانها
  zoomed.style.zIndex = '';
  zoomed = null;
  $('dim').classList.remove('on');      // نشيل الخلفية المعتمة
}

function zoomIn(c){                     // تكبير الصورة في نص الشاشة
  unzoom();
  c.style.transitionDelay = '0s';
  const r = c.getBoundingClientRect();
  const dx = innerWidth / 2 - (r.left + r.width / 2);     // المسافة لنص الشاشة
  const dy = innerHeight / 2 - (r.top + r.height / 2);
  // نسبة التكبير: على قد ما الشاشة تسمح، وأقصى حاجة 3 أضعاف (غيّري الرقم 3 لو عاوزة)
  const k = Math.min(innerWidth * 0.9 / c.offsetWidth, innerHeight * 0.85 / c.offsetHeight, 3);
  c.style.zIndex = 60;
  c.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;
  zoomed = c;
  $('dim').classList.add('on');
}
/* الضغط على أي مكان في الشاشة (حتى على الصورة نفسها) يرجّع الصورة */
document.addEventListener('click', e => {
  if (!zoomed) return;
  e.stopPropagation();
  unzoom();
}, true);

/* ----- أزرار الانتقال ----- */
$('toLetter').addEventListener('click', () => goTo('page3'));

/* فتح الظرف: الغطا يتفتح، وبعد ثانية الظرف يختفي والرسالة تظهر */
$('envelope').addEventListener('click', () => {
  const env = $('envelope');
  if (env.classList.contains('open')) return;
  env.classList.add('open');
  setTimeout(() => {
    env.classList.add('gone');
    $('envHint').style.display = 'none';
    $('letter').classList.add('show');
    $('restart').hidden = false;

});

$('restart').addEventListener('click', () => {
  $('envelope').classList.remove('open', 'gone');     // نقفل الظرف تاني
  $('letter').classList.remove('show');
  $('envHint').style.display = '';
  $('restart').hidden = true;
  $('cake').classList.remove('out');

});
/* ----- الأغنية: بتشتغل أول ما تدوسي في أي مكان (المتصفحات بتمنع التشغيل التلقائي) ----- */
const audio = CONFIG.song ? new Audio(CONFIG.song) : null;
if (audio) {
  audio.loop = true; audio.volume = 0.7;
  let userPaused = false;                  // لو إنتِ وقفتيها بإيدك منرجّعهاش
  const btn = $('musicBtn');
  btn.hidden = false;
  const sync = () => { btn.textContent = audio.paused ? '🔇' : '🔊'; };
  audio.addEventListener('play', sync);
  audio.addEventListener('pause', sync);
  audio.addEventListener('error', () => { btn.hidden = true; });   // مفيش ملف أغنية = الزرار يختفي
  audio.play().catch(() => {});            // محاولة تشغيل تلقائي (غالبًا بتتمنع)
  document.addEventListener('pointerdown', e => {
    if (e.target === btn || userPaused) return;
    if (audio.paused) audio.play().catch(() => {});
  });
  btn.addEventListener('click', () => {
    if (audio.paused) { userPaused = false; audio.play().catch(() => {}); }
    else { userPaused = true; audio.pause(); }
  });
}

/* ----- الترتر النازل من الشاشة ----- */
(function(){
  const cv = $('glitter'), ctx = cv.getContext('2d');
  const dpr = devicePixelRatio || 1;
  const cols = ['#FFD66B','#FFF3C4','#FF9EC0','#FFFFFF','#F2B77A'];   // ألوان الترتر
  const COUNT = matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : 70;   // عدد الترتر
  let W, H, bits = [];
  function size(){ W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; }
  size(); addEventListener('resize', size);
  function make(fromTop){
    return { x: Math.random() * W, y: fromTop ? -10 * dpr : Math.random() * H,
             s: (2 + Math.random() * 4) * dpr,          // الحجم
             vy: (0.6 + Math.random() * 1.4) * dpr,     // سرعة النزول
             sw: (0.3 + Math.random() * 0.6) * dpr,     // الرجرجة يمين وشمال
             ph: Math.random() * 6.28, t: Math.random() * 6.28,
             c: cols[Math.floor(Math.random() * cols.length)] };
  }
  for (let i = 0; i < COUNT; i++) bits.push(make(false));
  function frame(){
    ctx.clearRect(0, 0, W, H);
    bits.forEach((b, i) => {
      b.y += b.vy; b.ph += 0.03; b.t += 0.1;
      b.x += Math.sin(b.ph) * b.sw;
      if (b.y > H + 20) bits[i] = make(true);               // لما يوصل تحت يبدأ من فوق تاني
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(b.t));   // اللمعان
      ctx.translate(b.x, b.y); ctx.rotate(b.t * 0.5);
      ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s);
      ctx.restore();
    });
    requestAnimationFrame(frame);
  }
  if (COUNT) frame();
})();
